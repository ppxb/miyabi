name: Publish Miyabi image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ppxb/miyabi

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$version' (expected e.g. 1.2.3)" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, changelog]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Draft Release
        shell: bash
        run: |
          tag="v${VERSION}"

          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release '$tag' already exists; keeping the existing release body."
            exit 0
          fi

          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Release $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}

  # 仅用于按架构预热 buildx/GHA 缓存，不推送任何镜像，
  # 因此不会在 registry 里留下 build-<run_id>-<arch> 这类中间 tag。
  build:
    name: Warm cache (${{ matrix.suffix }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Warm cache [${{ matrix.platform }}]
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=miyabi-${{ matrix.suffix }}
          cache-to: type=gha,scope=miyabi-${{ matrix.suffix }},mode=max
          provenance: false
          sbom: false

  # 一步构建并推送多架构 manifest，复用上面预热好的按架构缓存，
  # registry 中只会出现最终的正式 tag。
  publish:
    name: Build and push multi-arch image
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=miyabi-amd64
            type=gha,scope=miyabi-arm64
          provenance: false
          sbom: false

  # 构建免 Docker 的独立二进制（当前为 Windows 桌面版），并附到同一个 Release。
  binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
            ldflags: "-s -w -H windowsgui"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -mod=readonly -trimpath \
            -ldflags="${{ matrix.ldflags }}" \
            -o "dist/miyabi${{ matrix.ext }}" ./cmd

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="miyabi_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p pkg
          cp "dist/miyabi${{ matrix.ext }}" pkg/
          cp LICENSE pkg/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd pkg && zip -r "../${name}.zip" .)
            echo "file=${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${name}.tar.gz" -C pkg .
            echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # 汇总所有二进制，校验和一并附到 draft release（在正式发布前完成）。
  release-assets:
    name: Attach binaries to release
    needs: [version, create-draft-release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v${VERSION}" dist/* --clobber --repo "${{ github.repository }}"

  publish-release:
    name: Publish release
    needs: [version, create-draft-release, publish, release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
